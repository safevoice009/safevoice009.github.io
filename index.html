<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panther | The Future of Autonomous Intelligence. Architecting deterministic, self-healing systems.">
    <title>Panther | Autonomous Intelligence</title>
    
    <!-- Premium Fonts: DM Sans as used in 100ms.ai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #FAF9F4;      /* 100ms background */
            --ink: #1C1E20;        /* 100ms text/dark */
            --indigo: #5D43D2;     /* 100ms accent */
            --indigo-soft: #EEECFB;
            --gray-light: #F1F1F1;
            --transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            line-height: 1.2;
        }

        /* --- Animations --- */
        @keyframes reveal {
            from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(20px); }
            to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); }
        }

        /* --- Components --- */
        header {
            min-height: 80vh;
            padding: 100px 8vw 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--indigo);
            margin-bottom: 24px;
            display: inline-block;
            animation: reveal 1s ease-out;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 7.5rem);
            font-weight: 300;
            letter-spacing: -0.03em; /* Tight tracking like 100ms */
            line-height: 0.9;
            margin-bottom: 40px;
            animation: reveal 1.2s ease-out 0.2s backwards;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            animation: reveal 1s ease-out 0.4s backwards;
        }

        .btn {
            padding: 18px 40px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--ink);
            color: var(--paper);
        }

        .btn-primary:hover {
            background-color: var(--indigo);
            transform: scale(1.05);
        }

        .container {
            padding: 0 8vw 120px;
        }

        /* --- Bento Repository Grid --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 48px;
            padding-top: 80px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .repo-card {
            background: white;
            padding: 64px;
            border-radius: 32px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .repo-card:hover {
            border-color: var(--indigo-soft);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.08);
            transform: translateY(-8px);
        }

        .repo-card h3 {
            font-size: 2rem;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .repo-card p {
            font-size: 1.125rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
            flex-grow: 1;
        }

        .repo-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            color: var(--ink);
        }

        .repo-link {
            color: var(--indigo);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .star-box {
            background: var(--gray-light);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        /* --- Floating Link Bubble --- */
        .bubble {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 64px;
            height: 64px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            z-index: 100;
            transition: var(--transition);
            text-decoration: none;
        }

        .bubble:hover {
            background: var(--indigo);
            transform: scale(1.1) rotate(15deg);
        }

        /* --- Responsible Design --- */
        @media (max-width: 1024px) {
            h1 { font-size: 18vw; }
            .repo-grid { grid-template-columns: 1fr; }
            .repo-card { padding: 40px; }
        }

        .loader {
            padding: 100px;
            text-align: center;
            font-size: 1.25rem;
            color: #999;
        }
    </style>
</head>
<body>

    <header>
        <span class="label">The Autonomous Frontier</span>
        <h1>Panther</h1>
        <div class="cta-group">
            <a href="https://github.com/safevoice009" class="btn btn-primary">Strategic Repository</a>
            <a href="mailto:panthers009@proton.me" class="btn" style="border: 1px solid var(--ink)">Contact Panther</a>
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <h2>Ecosystem</h2>
            <div style="font-size: 0.85rem; color: #999;">LIVE REAL-TIME SYNC</div>
        </div>

        <div id="repo-container" class="repo-grid">
            <div class="loader">Accessing Network Assets...</div>
        </div>
    </div>

    <!-- Floating Contact/Action Bubble -->
    <a href="https://github.com/safevoice009/AetherClaw" class="bubble" title="View AetherClaw">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </a>

    <script>
        const USERNAME = 'safevoice009';
        const CONTAINER = document.getElementById('repo-container');

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`);
                let repos = await response.json();

                repos = repos
                    .filter(repo => !repo.fork)
                    .sort((a, b) => (b.stargazers_count + (new Date(b.created_at).getTime() / 1e12)) - (a.stargazers_count + (new Date(a.created_at).getTime() / 1e12)));

                CONTAINER.innerHTML = '';
                
                repos.forEach(repo => {
                    const card = `
                        <a href="${repo.html_url}" class="repo-card" target="_blank">
                            <div class="repo-link">EXPLORE SOLUTION &rarr;</div>
                            <h3>${repo.name}</h3>
                            <p>${repo.description || "Architecting deterministic systems for the next era of autonomous intelligence."}</p>
                            <div class="repo-footer">
                                <div class="star-box">${repo.stargazers_count} Stars</div>
                                <div style="font-size: 0.75rem; color: #999; font-weight: 400;">VERSION: STABLE</div>
                            </div>
                        </a>
                    `;
                    CONTAINER.innerHTML += card;
                });

            } catch (error) {
                CONTAINER.innerHTML = `<div class="loader" style="color: #ff4444;">Atmospheric connection failed.</div>`;
            }
        }

        fetchRepos();
    </script>
</body>
</html>
