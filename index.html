<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official portfolio of safevoice009. Architect of AetherClaw and autonomous systems.">
    <meta name="keywords" content="safevoice009, AetherClaw, AI Architect, GitHub Portfolio, Autonomous Agents">
    <title>safevoice009 | Digital Architect</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0D0D0D;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #7000FF;
            --accent-soft: rgba(112, 0, 255, 0.5);
            --text-main: #FFFFFF;
            --text-dim: #888888;
            --glass: rgba(13, 13, 13, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* --- Animations --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes subtleGlow {
            0% { box-shadow: 0 0 20px rgba(112, 0, 255, 0.1); }
            50% { box-shadow: 0 0 40px rgba(112, 0, 255, 0.2); }
            100% { box-shadow: 0 0 20px rgba(112, 0, 255, 0.1); }
        }

        /* --- Layout --- */
        header {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, #1A0D33 0%, #0D0D0D 80%);
        }

        .profile-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 16px;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-dim);
            max-width: 600px;
            animation: fadeInUp 1s ease-out 0.4s backwards;
        }

        .container {
            max-width: 1200px;
            margin: -100px auto 100px;
            padding: 0 40px;
        }

        /* --- Repository Grid --- */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
        }

        .repo-grid.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .repo-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .repo-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-soft);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .repo-card h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .repo-card p {
            color: var(--text-dim);
            font-size: 1rem;
            margin-bottom: 30px;
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .repo-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-dim);
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .star-count {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #FFD700;
            font-weight: 600;
        }

        .created-at {
            color: var(--text-dim);
        }

        /* --- Link Bubbles --- */
        .link-group {
            display: flex;
            gap: 12px;
            margin-top: 40px;
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        .bubble {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 10px 24px;
            border-radius: 100px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .bubble:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        /* --- Loading State --- */
        .loader {
            text-align: center;
            padding: 100px;
            color: var(--text-dim);
            font-style: italic;
        }

        @media (max-width: 768px) {
            header { height: 50vh; }
            .container { margin-top: -50px; padding: 0 20px; }
            .repo-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-badge">Architectural Lead</div>
        <h1>safevoice009</h1>
        <p class="tagline">Pioneering deterministic AI environments and self-healing autonomous systems.</p>
        
        <div class="link-group">
            <a href="https://github.com/safevoice009" class="bubble">GitHub</a>
            <a href="mailto:panthers009@proton.me" class="bubble">Contact</a>
        </div>
    </header>

    <div class="container">
        <div id="repo-container" class="repo-grid">
            <div class="loader">Synchronizing tactical assets...</div>
        </div>
    </div>

    <script>
        const USERNAME = 'safevoice009';
        const CONTAINER = document.getElementById('repo-container');

        async function fetchRepos() {
            try {
                const response = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=100`);
                let repos = await response.json();

                // Sort by Stars (Primary) then Date (Secondary)
                repos = repos
                    .filter(repo => !repo.fork) // Hide forks to keep it professional
                    .sort((a, b) => (b.stargazers_count + (new Date(b.created_at).getTime() / 1e12)) - (a.stargazers_count + (new Date(a.created_at).getTime() / 1e12)));

                CONTAINER.innerHTML = '';
                
                repos.forEach(repo => {
                    const date = new Date(repo.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short'
                    });

                    const card = `
                        <a href="${repo.html_url}" class="repo-card" target="_blank">
                            <h3>${repo.name}</h3>
                            <p>${repo.description || "Experimental autonomous system designed for strategic leverage."}</p>
                            <div class="repo-meta">
                                <span class="star-count">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    ${repo.stargazers_count}
                                </span>
                                <span class="created-at">Created ${date}</span>
                            </div>
                        </a>
                    `;
                    CONTAINER.innerHTML += card;
                });

                CONTAINER.classList.add('loaded');
            } catch (error) {
                CONTAINER.innerHTML = `<div class="loader" style="color: #ff4444;">Atmospheric connection failed. Please refresh.</div>`;
            }
        }

        fetchRepos();
    </script>
</body>
</html>
